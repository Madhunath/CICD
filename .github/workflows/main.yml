name: Node.js Docker CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. Continuous Integration (CI)
  # ==========================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  # ==========================================
  # 2. Continuous Deployment (CD via Docker)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "==> Navigating to app directory..."
            cd /var/CICD/

            echo "==> Pulling latest code..."
            git reset --hard origin/main
            git pull origin main

            echo "==> Building Docker image..."
            docker build -t node-cicd-app:latest .

            echo "==> Stopping old container (if running)..."
            docker stop node-cicd-container || true
            docker rm node-cicd-container || true

            echo "==> Starting new container on port 3000..."
            docker run -d \
              --name node-cicd-container \
              --restart always \
              -p 3000:3000 \
              node-cicd-app:latest

            echo "==> Cleaning up unused dangling Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
